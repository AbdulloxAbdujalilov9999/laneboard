<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haulwise Loads</title>
<meta name="description" content="Loads &amp; lanes companion to Haulwise Dispatch — map, mileage, RPM and full load detail in one view.">
<meta name="theme-color" content="#080d1c">
<link rel="icon" href="data:,">
<style>
/* ============================== THEME (matches Haulwise Dispatch) ============================== */
:root {
  --bg:#f4f6fb; --panel:#ffffff; --panel2:#eef1f8; --line:#dfe4f0; --ink:#0f172a; --soft:#5b6785;
  --brand:#2f5be7; --brand-ink:#ffffff; --brand-soft:#e6ecff; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
  --good:#16a34a; --warn:#d97706; --bad:#dc2626; --radius:12px;
}
:root[data-theme="dark"] {
  --bg:#080d1c; --panel:#10172e; --panel2:#182042; --line:#232d52; --ink:#e8ecf8; --soft:#93a0c4;
  --brand:#4a74ff; --brand-soft:#16234f; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --good:#34d17a; --warn:#f5a524; --bad:#f2646b;
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; overflow:hidden; }
a { color:var(--brand); text-decoration:none; }
button,input,select,textarea { font:inherit; color:inherit; }
h1,h2,h3 { margin:0; line-height:1.25; }
.muted { color:var(--soft); }
.strong { font-weight:600; }

#app { display:flex; flex-direction:column; height:100vh; }
body:not(.authed) #app { display:none; }
body.authed #gate { display:none; }

/* ---- top bar ---- */
.topbar { display:flex; align-items:center; gap:12px 16px; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--panel); flex:0 0 auto; flex-wrap:wrap; row-gap:8px; }
.brand { display:flex; align-items:center; gap:9px; font-weight:800; font-size:16px; white-space:nowrap; }
.brand .mark { width:26px; height:26px; border-radius:8px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; }
.brand small { display:block; font-weight:500; font-size:11px; color:var(--soft); margin-top:-2px; }
.tabs { display:flex; gap:2px; background:var(--panel2); border-radius:10px; padding:3px; flex:0 0 auto; }
.tabs button { border:0; background:transparent; padding:7px 16px; border-radius:8px; cursor:pointer; font-weight:600; color:var(--soft); }
.tabs button.active { background:var(--panel); color:var(--ink); box-shadow:var(--shadow); }
.spacer { flex:1; }
.stat-strip { display:flex; align-items:center; gap:14px; font-size:13px; white-space:nowrap; }
.stat-strip b { font-variant-numeric:tabular-nums; }
.stat-strip .divider { color:var(--line); }
.i { display:inline-flex; width:1em; height:1em; flex:0 0 auto; }
.i svg { width:100%; height:100%; display:block; }
.icon-btn, .btn { border:1px solid var(--line); background:var(--panel); color:var(--ink); border-radius:9px; padding:7px 12px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-weight:600; font-size:13px; white-space:nowrap; transition:border-color .12s, background .12s, color .12s; }
.icon-btn .i, .btn .i { font-size:15px; color:var(--soft); }
.icon-btn:hover, .btn:hover { border-color:var(--brand); }
.icon-btn:hover .i { color:var(--brand); }
.btn-primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); }
.btn-primary .i { color:var(--brand-ink); }
.btn-primary:hover { filter:brightness(1.06); }
.btn-primary:hover .i { color:var(--brand-ink); }
.icon-btn-square { padding:8px; }
.icon-btn-square .i { font-size:16px; }
#refreshBtn.spinning .i { animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }
.user-chip { display:flex; align-items:center; gap:8px; font-size:12.5px; padding:6px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel2); white-space:nowrap; }
.user-chip b { font-weight:700; }
.icon-btn-plain { border:0; background:none; cursor:pointer; color:var(--soft); display:inline-flex; padding:2px; }
.icon-btn-plain:hover { color:var(--bad); }

/* ---- filter bar ---- */
.filterbar { display:flex; align-items:center; gap:8px; padding:10px 18px; border-bottom:1px solid var(--line); background:var(--panel2); flex:0 0 auto; flex-wrap:wrap; }
.filterbar input, .filterbar select { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
.search-wrap { position:relative; flex:1 1 220px; min-width:160px; }
.search-wrap .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:var(--soft); font-size:14px; pointer-events:none; }
.search-wrap input.search { width:100%; padding-left:32px; }
.week-nav { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.week-nav input[type="date"] { min-width:150px; }

/* ---- main split ---- */
.main { flex:1; display:flex; min-height:0; }
.map-pane { position:relative; flex:1 1 auto; background:var(--panel2); }
#map { position:absolute; inset:0; }
.map-pane.dark-tiles .leaflet-tile-pane { filter:invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9); }
.map-overlay { position:absolute; top:14px; left:14px; z-index:500; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:12px 16px; max-width:320px; }
.map-overlay .empty-hint { color:var(--soft); font-size:13px; }
.map-legend { display:flex; gap:16px; margin-top:6px; font-size:12px; color:var(--soft); }
.map-legend span { display:inline-flex; align-items:center; gap:5px; }
.dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
.dot.pu { background:var(--good); } .dot.del { background:var(--bad); }

.list-pane { width:440px; flex:0 0 auto; border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
.list-pane .list-head { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px; }
.list-head-actions { display:flex; align-items:center; gap:8px; }
.sort-select { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:12.5px; }
.map-cap-note { position:absolute; bottom:10px; left:14px; right:14px; z-index:500; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12px; color:var(--soft); text-align:center; }
.map-cap-note:empty { display:none; }
.list-scroll { flex:1; overflow-y:auto; padding:10px; }
.empty { padding:40px 20px; text-align:center; color:var(--soft); }

/* ---- load card ---- */
.card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); margin-bottom:8px; overflow:hidden; transition:border-color .12s; }
.card.selected { border-color:var(--brand); box-shadow:0 0 0 1px var(--brand); }
.card-head { padding:11px 13px; cursor:pointer; display:flex; flex-direction:column; gap:6px; }
.card-row1 { display:flex; align-items:center; gap:8px; }
.card-ref { font-weight:700; font-size:13px; }
.route-line { display:flex; align-items:center; gap:6px; font-weight:600; font-size:14px; margin:2px 0; }
.route-line .i { color:var(--soft); font-size:13px; }
.card-meta { display:flex; gap:12px; font-size:12.5px; color:var(--soft); flex-wrap:wrap; }
.card-meta .meta-item { display:inline-flex; align-items:center; gap:4px; }
.card-meta .i { font-size:13px; }
.card-meta b { color:var(--ink); font-weight:600; }
.chev { transition:transform .15s; color:var(--soft); font-size:15px; }
.card.open .chev { transform:rotate(180deg); }

.badge { --c:#64748b; display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:color-mix(in srgb, var(--c) 16%, transparent); color:var(--c); text-transform:uppercase; letter-spacing:.02em; white-space:nowrap; }
.badge .i { font-size:11px; }
.b-BOOKED { --c:#3b82f6; } .b-DISPATCHED { --c:#8b5cf6; } .b-IN_TRANSIT { --c:var(--warn); }
.b-DELIVERED { --c:var(--good); } .b-INVOICED { --c:#0d9488; } .b-CANCELLED { --c:var(--bad); } .b-LANE { --c:#c026d3; }

.card-body { border-top:1px solid var(--line); padding:13px; display:none; background:var(--panel2); }
.card.open .card-body { display:block; }
.detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px 16px; margin-bottom:10px; }
.detail-grid .full { grid-column:1/-1; }
.detail-item .l { font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--soft); margin-bottom:2px; }
.detail-item .v { font-size:13.5px; font-weight:600; }
.rate-strip { display:flex; gap:10px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); flex-wrap:wrap; }
.rate-pill { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:12.5px; }
.rate-pill b { font-size:14px; }
.note-box { margin-top:10px; font-size:13px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 10px; display:flex; align-items:flex-start; gap:8px; }
.note-box .i { color:var(--soft); margin-top:2px; }

/* ---- lanes table ---- */
.lanes-pane { flex:1; overflow:auto; padding:18px; }
.lanes-hint { display:flex; align-items:center; gap:6px; color:var(--soft); font-size:12.5px; margin-bottom:12px; }
.lanes-hint .i { color:#c026d3; }
table.lanes { width:100%; border-collapse:collapse; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
table.lanes th, table.lanes td { padding:11px 14px; text-align:left; border-bottom:1px solid var(--line); font-size:13.5px; }
table.lanes th { background:var(--panel2); font-size:11.5px; text-transform:uppercase; letter-spacing:.03em; color:var(--soft); cursor:pointer; user-select:none; white-space:nowrap; }
table.lanes th:hover { color:var(--ink); }
table.lanes tbody tr:hover { background:var(--panel2); }
table.lanes tbody tr { cursor:pointer; }
.sort-arrow { font-size:10px; margin-left:3px; }

/* ---- shared form bits (used by the sign-in gate) ---- */
.f { display:block; font-size:12.5px; font-weight:600; margin-bottom:4px; color:var(--soft); }
.input, .select, .textarea { width:100%; background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
.textarea { min-height:60px; resize:vertical; }

/* ---- sign-in gate ---- */
#gate { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:3000; padding:20px; overflow-y:auto; }
.gate-card { width:100%; max-width:380px; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:28px 26px; }
.gate-brand { display:flex; align-items:center; justify-content:center; gap:9px; font-weight:800; font-size:18px; margin-bottom:22px; }
.gate-brand .mark { width:32px; height:32px; border-radius:9px; background:var(--brand); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; }
.gate-icon { width:44px; height:44px; border-radius:50%; background:var(--panel2); display:flex; align-items:center; justify-content:center; margin:0 auto 14px; color:var(--brand); font-size:20px; }
.gate-title { font-size:15px; font-weight:700; margin-bottom:4px; text-align:center; }
.gate-sub { color:var(--soft); font-size:13px; text-align:center; margin-bottom:20px; }
.gate-field { margin-bottom:12px; }
.gate-error { background:color-mix(in srgb, var(--bad) 12%, transparent); color:var(--bad); border-radius:8px; padding:8px 10px; font-size:12.5px; margin-bottom:12px; }

/* ---- offline banner ---- */
.offline-banner { display:none; align-items:center; justify-content:center; gap:8px; padding:7px; background:var(--warn); color:#1a1300; font-size:12.5px; font-weight:600; flex:0 0 auto; }
body.offline .offline-banner { display:flex; }

/* ---- toasts ---- */
#toastRoot { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:4000; align-items:center; }
.toast { background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:600; box-shadow:var(--shadow); font-size:13px; }

@media (max-width: 880px) {
  body { overflow:auto; }
  #app { height:auto; min-height:100vh; }
  .main { flex-direction:column; }
  .map-pane { height:340px; }
  .list-pane { width:auto; border-left:0; border-top:1px solid var(--line); }
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="gate-brand"><span class="mark">H</span><span>Haulwise Loads</span></div>
    <div id="gateBody"></div>
  </div>
</div>

<div id="app">

  <header class="topbar">
    <div class="brand"><span class="mark">H</span><span>Haulwise Loads<small>Loads &amp; lanes</small></span></div>
    <div class="tabs">
      <button data-tab="loads" class="active">Loads</button>
      <button data-tab="lanes">Lanes</button>
    </div>
    <div class="spacer"></div>
    <div class="stat-strip" id="statStrip"></div>
    <span class="muted" id="lastLoad" style="font-size:11.5px"></span>
    <div class="user-chip"><span id="userChipText"></span><button class="icon-btn-plain" id="signOutBtn" title="Sign out" aria-label="Sign out"></button></div>
    <button class="icon-btn icon-btn-square" id="refreshBtn" title="Refresh loads" aria-label="Refresh loads"></button>
    <button class="icon-btn icon-btn-square" id="themeToggle" title="Toggle theme" aria-label="Toggle theme"></button>
  </header>

  <div class="offline-banner" id="offlineBanner"></div>

  <div class="filterbar">
    <div class="search-wrap"><span class="i search-icon" id="searchIcon"></span><input class="search" id="searchInput" type="search" placeholder="Search ref, city or broker… (press /)"></div>
    <select id="statusFilter"><option value="">All statuses</option></select>
    <select id="equipFilter"><option value="">All equipment</option></select>
    <select id="dispatcherFilter"><option value="">All dispatchers</option></select>
    <div class="week-nav">
      <button class="icon-btn" id="prevWeek"></button>
      <input type="date" id="weekStart">
      <button class="icon-btn" id="nextWeek"></button>
      <button class="icon-btn" id="clearWeek" title="Show every load"></button>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="clearFilters"></button>
  </div>

  <div class="main" id="loadsView">
    <div class="map-pane">
      <div id="map"></div>
      <div class="map-overlay" id="mapOverlay"></div>
      <div class="map-cap-note" id="mapCapNote"></div>
    </div>
    <div class="list-pane">
      <div class="list-head">
        <b id="listCount">0 loads</b>
        <div class="list-head-actions">
          <select id="sortSelect" class="sort-select"></select>
          <button class="icon-btn" id="exportCsvBtn" title="Export the loads shown as CSV"></button>
        </div>
      </div>
      <div class="list-scroll" id="listScroll"></div>
    </div>
  </div>

  <div class="lanes-pane" id="lanesView" style="display:none"></div>

</div>

<div id="toastRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="data.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
